# Gates from sw-design.md §11.7.
#
# Layers 1-3 run on **Linux and Windows** (N3: the app runs on both, and N4's
# explicit-encoding rule fails late and quietly if Windows is never
# exercised). E2E runs on Linux only, with Playwright traces on failure.

name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Never the developer's ./var, and never a path with a space in it.
  RA2_DATA_DIR: ${{ github.workspace }}/ci-var
  FORCE_COLOR: "1"

jobs:
  lint:
    name: lint (ruff · mypy strict · import-linter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff format --check .
      - run: uv run ruff check --output-format=github .
      - run: uv run mypy
      - run: uv run lint-imports

  test:
    name: layers 1-3 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      # The schema comes from Alembic, never metadata.create_all (§12.10).
      - run: uv run alembic upgrade head
      - name: unit + backend + ui
        run: >
          uv run pytest -m "not e2e and not eval and not visual"
          --cov=ra2/domain --cov=ra2/services --cov-report=term-missing
          --junitxml=test-results/junit-${{ matrix.os }}.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: test-results/
          if-no-files-found: ignore

  e2e:
    name: layer 4 — Playwright journeys (linux only)
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Install Chromium
        run: uv run playwright install --with-deps chromium
      - run: uv run alembic upgrade head
      - name: J1-J6
        run: >
          uv run pytest -m e2e
          --tracing=retain-on-failure
          --screenshot=only-on-failure
          --output=test-results/e2e
      - name: Upload traces and screenshots
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/e2e
          if-no-files-found: ignore

  migrations:
    name: alembic check (models and migrations agree)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run alembic upgrade head
      # Green against zero migrations at M0; A3 makes it meaningful.
      - run: uv run alembic check
